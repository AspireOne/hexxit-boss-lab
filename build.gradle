buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net' }
        maven { url 'https://repo.sleeping.town' }
    }
    dependencies { classpath 'agency.highlysuspect:voldeloom:2.4' }
}

plugins {
    id 'com.diffplug.spotless' version '6.25.0'
    id 'com.github.spotbugs' version '5.2.5'
}

apply plugin: 'agency.highlysuspect.voldeloom'

group = 'dev.hexxitlab'
version = '0.5.3'

java.toolchain.languageVersion = JavaLanguageVersion.of(11)

sourceSets {
    harness {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('harnessDevJar', Jar) {
    archiveClassifier = 'harness-dev'
    from sourceSets.harness.output
    // Include our entity hierarchy while remapping inherited Minecraft members.
    from sourceSets.main.output
}
tasks.register('harnessRemappedJar', net.fabricmc.loom.task.ReobfJarTask) {
    dependsOn 'harnessDevJar'
    input = tasks.named('harnessDevJar').flatMap { it.archiveFile }
    archiveClassifier = 'harness-all'
}
tasks.register('harnessJar', Jar) {
    dependsOn 'harnessRemappedJar'
    from({ zipTree(tasks.named('harnessRemappedJar').get().archiveFile.get().asFile) }) {
        include 'dev/hexxitlab/harness/**'
    }
    archiveClassifier = 'harness'
}
tasks.named('check') { dependsOn 'harnessClasses' }

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.5.2'
    forge 'net.minecraftforge:forge:1.5.2-7.8.1.737:universal@zip'
    mappings 'net.minecraftforge:forge:1.5.2-7.8.1.737:src@zip'
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(6)
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-options', '-Werror']
}

spotless {
    java { googleJavaFormat('1.17.0'); target 'src/**/*.java' }
}

spotbugs {
    toolVersion = '4.8.6'
    effort = 'max'
    reportLevel = 'medium'
    excludeFilter = file('config/spotbugs-exclude.xml')
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports { html.required = true; xml.required = true }
}

def gitValue = { List<String> args ->
    def output = new ByteArrayOutputStream()
    def result = exec {
        commandLine(['git'] + args)
        standardOutput = output
        errorOutput = new ByteArrayOutputStream()
        ignoreExitValue = true
    }
    result.exitValue == 0 ? output.toString('UTF-8').trim() : 'uncommitted'
}

tasks.register('buildIdentity') {
    def destination = layout.buildDirectory.file('generated/resources/hexxitlab-build.properties')
    outputs.file(destination)
    outputs.upToDateWhen { false }
    doLast {
        destination.get().asFile.parentFile.mkdirs()
        destination.get().asFile.text = "version=${project.version}\nrevision=${gitValue(['rev-parse', 'HEAD'])}\ndirty=${!gitValue(['status', '--porcelain']).isEmpty()}\n"
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/resources'))
processResources.dependsOn('buildIdentity')

// Consumers use these task outputs rather than reconstructing versioned filenames.
['release': 'remapJarForRelease', 'harness': 'harnessJar'].each { kind, archiveTask ->
    tasks.register("${kind}ArtifactManifest") {
        dependsOn archiveTask, 'buildIdentity'
        def destination = layout.buildDirectory.file("artifacts/${kind}.json")
        outputs.file(destination)
        outputs.upToDateWhen { false }
        doLast {
            def artifact = tasks.named(archiveTask).get().archiveFile.get().asFile
            def identity = new Properties()
            layout.buildDirectory.file('generated/resources/hexxitlab-build.properties').get().asFile.withInputStream {
                identity.load(it)
            }
            def manifest = [
                path: relativePath(artifact),
                sha256: java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString(),
                version: identity.getProperty('version'),
                revision: identity.getProperty('revision'),
                dirty: identity.getProperty('dirty')
            ]
            destination.get().asFile.parentFile.mkdirs()
            destination.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
        }
    }
}
tasks.named('build') { dependsOn 'releaseArtifactManifest' }

tasks.register('verifyBytecode') {
    dependsOn tasks.named('classes')
    doLast {
        fileTree(layout.buildDirectory.dir('classes/java/main')).matching { include '**/*.class' }.each { file ->
            file.withDataInputStream { input ->
                if (input.readInt() != (int) 0xCAFEBABE) throw new GradleException("Invalid class: ${file}")
                input.readUnsignedShort()
                if (input.readUnsignedShort() > 50) throw new GradleException("Java 6 bytecode required: ${file}")
            }
        }
    }
}
check.dependsOn('verifyBytecode')

tasks.register('workflowTest', Exec) {
    commandLine 'python', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_*.py', '-v'
}
check.dependsOn('workflowTest')

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
